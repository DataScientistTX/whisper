name: Server

on:
  push:
    branches: [main]
  pull_request:
    paths: ['server/**', 'scripts/**', '.github/workflows/server.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies, so there's nothing to install.
      - name: Unit and end-to-end tests
        working-directory: server
        run: npm test
