# Generate the Xcode project with:  brew install xcodegen && xcodegen
# Set PRODUCT_BUNDLE_IDENTIFIER below to the same value as APNS_BUNDLE_ID on the server.
name: Whisper
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Whisper:
    type: application
    platform: iOS
    sources:
      - path: Whisper
    info:
      path: Whisper/Info.plist
      properties:
        CFBundleDisplayName: Whisper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Whisper uses your location while you're visible so people right around you can find you. Exact coordinates are never shown to anyone."
        UIBackgroundModes: [location, remote-notification]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Whisper/Whisper.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.whisper
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
